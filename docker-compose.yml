version: "3.8"

services:
  # Next.js Application
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: whatsapp_sales_web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_secure_pass_2026@db:5432/whatsapp_sales_platform?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - GROK_API_KEY=${GROK_API_KEY}
      - WHATSAPP_ACCESS_TOKEN=${WHATSAPP_ACCESS_TOKEN}
      - WHATSAPP_PHONE_NUMBER_ID=${WHATSAPP_PHONE_NUMBER_ID}
      - WHATSAPP_BUSINESS_ACCOUNT_ID=${WHATSAPP_BUSINESS_ACCOUNT_ID}
      - WEBHOOK_VERIFY_TOKEN=${WEBHOOK_VERIFY_TOKEN}
      - NODE_ENV=production
    depends_on:
      - db
      - redis
    networks:
      - platform_network

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: whatsapp_sales_db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres_secure_pass_2026
      - POSTGRES_DB=whatsapp_sales_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - platform_network

  # Redis Cache / BullMQ Store
  redis:
    image: redis:7-alpine
    container_name: whatsapp_sales_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - platform_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  platform_network:
    driver: bridge
